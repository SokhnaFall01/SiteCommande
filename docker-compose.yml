# Déploiement AUTONOME de SamaBoutik sur un serveur dédié.
# Inclut son propre reverse proxy Caddy (HTTPS automatique) : aucune dépendance
# à un autre projet. Renseigne DOMAIN et APP_URL dans .env.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: "production"
      DATABASE_URL: "file:/app/data/prod.db"
    volumes:
      - db_data:/app/data                 # base de données SQLite
      - uploads_data:/app/public/uploads  # photos uploadées
    command: >
      sh -c "npx prisma db push --skip-generate &&
             npx tsx prisma/seed.ts &&
             npm run start"
    expose:
      - "3000"   # interne : joint par Caddy, non exposé publiquement

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: "${DOMAIN}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  uploads_data:
  caddy_data:
  caddy_config:
