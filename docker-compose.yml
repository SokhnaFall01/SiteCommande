# SamaBoutik — application seule, à brancher derrière un reverse proxy Caddy
# DÉJÀ présent sur le serveur (partagé avec d'autres conteneurs).
#
# Le proxy joint l'app par le réseau Docker, via l'alias "samaboutik".
# Renseigne PROXY_NETWORK (le réseau du conteneur Caddy existant) dans .env.
#
# 👉 Serveur DÉDIÉ sans reverse proxy existant ? Utilise plutôt
#    docker-compose.standalone.yml (Caddy intégré).
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: "production"
      DATABASE_URL: "file:/app/data/prod.db"
    volumes:
      - db_data:/app/data                 # base de données SQLite
      - uploads_data:/app/public/uploads  # photos uploadées
    command: >
      sh -c "npx prisma db push --skip-generate &&
             npx tsx prisma/seed.ts &&
             npm run start"
    expose:
      - "3000"   # interne : joint par le Caddy existant, non exposé publiquement
    networks:
      proxy:
        aliases:
          - samaboutik

volumes:
  db_data:
  uploads_data:

networks:
  # Réseau du conteneur Caddy DÉJÀ présent (à définir dans .env : PROXY_NETWORK)
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy_default}
