services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sitecommande
      POSTGRES_PASSWORD: sitecommande
      POSTGRES_DB: sitecommande
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: "postgresql://sitecommande:sitecommande@db:5432/sitecommande"
      APP_URL: "${APP_URL:-http://localhost:3000}"
      SESSION_SECRET: "${SESSION_SECRET:-change-me-please-32-chars-minimum-value}"
      PAYMENT_PROVIDER: "${PAYMENT_PROVIDER:-mock}"
      PRIX_PUBLICATION: "${PRIX_PUBLICATION:-300}"
      DEVISE: "${DEVISE:-XOF}"
      # Emails via Gmail (voir .env / README)
      SMTP_HOST: "${SMTP_HOST:-smtp.gmail.com}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
    ports:
      - "3000:3000"
    volumes:
      # Persiste les photos uploadées entre les redémarrages du conteneur
      - uploads_data:/app/public/uploads

volumes:
  db_data:
  uploads_data:
